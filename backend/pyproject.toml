[project]
name = "backend"
version = "0.1.0"
description = "LearningJ local backend: FastAPI + SQLAlchemy 2.0 + Alembic (ADR-020)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=3.6.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "pydantic>=2.7",
    "msgpack>=1.0.8",
    "SudachiPy>=0.6.8",
    "SudachiDict-core>=20250129",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/learningj"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
